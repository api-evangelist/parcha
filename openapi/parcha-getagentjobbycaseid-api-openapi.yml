openapi: 3.2.0
info:
  title: Parcha Get Agent Job By Case ID API
  description: API to deploy Parcha AI Agents
  version: '1.0'
tags:
- name: GetAgentJobByCaseId
paths:
  /api/v1/getAgentJobByCaseId:
    get:
      summary: Get Agent Job By Case Id Route2
      operationId: get_agent_job_by_case_id_route2_api_v1_getAgentJobByCaseId_get
      security:
      - HTTPBearer: []
      parameters:
      - name: case_id
        in: query
        required: true
        schema:
          type: string
          title: Case Id
      - name: agent_key
        in: query
        required: true
        schema:
          type: string
          title: Agent Key
      - name: include_check_results
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Check Results
      - name: include_status_messages
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Include Status Messages
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetAgentJobByCaseId
components:
  schemas:
    JobsResponse:
      properties:
        jobs:
          items:
            type: object
          type: array
          title: Jobs
          description: The list of jobs
        count:
          type: integer
          title: Count
          description: The total jobs returned count
      type: object
      required:
      - jobs
      - count
      title: JobsResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

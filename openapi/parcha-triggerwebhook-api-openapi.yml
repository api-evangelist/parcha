openapi: 3.2.0
info:
  title: Parcha Trigger Webhook API
  description: API to deploy Parcha AI Agents
  version: '1.0'
tags:
- name: TriggerWebhook
paths:
  /api/v1/triggerWebhook:
    post:
      summary: Trigger Webhook
      description: Manually trigger a webhook for a job with optional URL override
      operationId: trigger_webhook_api_v1_triggerWebhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_trigger_webhook_api_v1_triggerWebhook_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - TriggerWebhook
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_trigger_webhook_api_v1_triggerWebhook_post:
      properties:
        job_id:
          type: string
          title: Job Id
        webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Url
      type: object
      required:
      - job_id
      title: Body_trigger_webhook_api_v1_triggerWebhook_post
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

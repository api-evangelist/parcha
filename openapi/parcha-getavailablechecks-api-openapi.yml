openapi: 3.0.0
info:
  title: Parcha Admin GetAvailableChecks API
  version: 1.0.0
  description: API for managing Parcha jobs and checks
servers:
- url: https://api.parcha.ai/api/v1
  description: Agent Hub API server
- url: https://demo.parcha.ai/api/v1
  description: Sandbox API server
- url: https://us1.parcha.ai/api/v1
  description: Legacy API server
- url: http://{your-company-domain}.parcha.ai/api/v1
  description: Custom Enterpris server (your company's API server)
security:
- bearerAuth: []
tags:
- name: GetAvailableChecks
paths:
  /getAvailableChecks:
    get:
      security:
      - bearerAuth: []
      summary: Get available checks
      description: Retrieve list of all available checks
      responses:
        '200':
          description: Available checks retrieved successfully
      tags:
      - GetAvailableChecks
  /api/v1/getAvailableChecks:
    get:
      summary: Get Available Checks
      operationId: get_available_checks_api_v1_getAvailableChecks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      tags:
      - GetAvailableChecks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key obtained from your Parcha account settings. Include as Bearer token in the Authorization header.

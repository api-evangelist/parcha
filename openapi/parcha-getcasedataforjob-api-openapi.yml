openapi: 3.2.0
info:
  title: Parcha Get Case Data For Job API
  description: API to deploy Parcha AI Agents
  version: '1.0'
tags:
- name: GetCaseDataForJob
paths:
  /api/v1/getCaseDataForJob:
    get:
      summary: Get Case Data For Job
      description: 'Get case data for a single job. Used for embedding EntityProfilePageInline in external sites.

        Requires API key authentication via Bearer token.'
      operationId: get_case_data_for_job_api_v1_getCaseDataForJob_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: query
        required: true
        schema:
          type: string
          title: Job Id
      - name: agent_key
        in: query
        required: true
        schema:
          type: string
          title: Agent Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetCaseDataForJob
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

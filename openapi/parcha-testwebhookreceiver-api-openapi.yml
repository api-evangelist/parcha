openapi: 3.0.0
info:
  title: Parcha Admin TestWebhookReceiver API
  version: 1.0.0
  description: API for managing Parcha jobs and checks
servers:
- url: https://api.parcha.ai/api/v1
  description: Agent Hub API server
- url: https://demo.parcha.ai/api/v1
  description: Sandbox API server
- url: https://us1.parcha.ai/api/v1
  description: Legacy API server
- url: http://{your-company-domain}.parcha.ai/api/v1
  description: Custom Enterpris server (your company's API server)
security:
- bearerAuth: []
tags:
- name: TestWebhookReceiver
paths:
  /testWebhookReceiver:
    post:
      security:
      - bearerAuth: []
      summary: Test webhook receiver
      responses:
        '200':
          description: Webhook received and signature verified
        '400':
          description: Invalid request
        '401':
          description: Invalid signature
      tags:
      - TestWebhookReceiver
  /api/v1/testWebhookReceiver:
    post:
      summary: Webhook Receiver
      operationId: webhook_receiver_api_v1_testWebhookReceiver_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      tags:
      - TestWebhookReceiver
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key obtained from your Parcha account settings. Include as Bearer token in the Authorization header.

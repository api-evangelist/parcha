openapi: 3.2.0
info:
  title: Parcha Download Report API
  version: '1.0'
  description: 'Operations tagged DownloadReport across 2 of this provider''s published API definitions: parcha-docs-openapi.yaml, parcha-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.parcha.ai/api/v1
  description: Agent Hub API server
- url: https://demo.parcha.ai/api/v1
  description: Sandbox API server
- url: https://us1.parcha.ai/api/v1
  description: Legacy API server
- url: http://{your-company-domain}.parcha.ai/api/v1
  description: Custom Enterpris server (your company's API server)
tags:
- name: DownloadReport
paths:
  /downloadReport:
    post:
      security:
      - bearerAuth: []
      summary: Download report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDownloadRequest'
      responses:
        '200':
          description: Report downloaded successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '404':
          description: Report not found
      tags:
      - DownloadReport
      operationId: postDownloadReport
      x-operation-id-source: derived
    servers:
    - url: https://api.parcha.ai/api/v1
      description: Agent Hub API server
    - url: https://demo.parcha.ai/api/v1
      description: Sandbox API server
    - url: https://us1.parcha.ai/api/v1
      description: Legacy API server
    - url: http://{your-company-domain}.parcha.ai/api/v1
      description: Custom Enterpris server (your company's API server)
  /api/v1/downloadReport:
    post:
      summary: Download Report
      description: 'Download a report for a specific case and agent.


        Args:

        report_request: Request containing case_id and agent_key

        Returns:

        StreamingResponse: The PDF report content with appropriate headers

        or JSONResponse: Error message if download fails'
      operationId: download_report_api_v1_downloadReport_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDownloadRequest_2'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - DownloadReport
components:
  schemas:
    ReportDownloadRequest:
      type: object
      required:
      - case_id
      - agent_key
      properties:
        case_id:
          type: string
          description: The unique identifier of the case
        agent_key:
          type: string
          description: The key of the agent to use for generating the report
        force_refresh_report:
          type: boolean
          default: false
          description: If true, forces regeneration of the report even if cached
        download_test_report:
          type: boolean
          default: false
          description: If true, returns a placeholder test report (useful for testing the endpoint)
        report_version:
          type: string
          enum:
          - v1
          - v2
          default: v1
          description: The report version to use. Use "v2" for the latest Parcha 2.0 report format with enhanced styling and layout.
    ReportDownloadRequest_2:
      properties:
        case_id:
          type: string
          title: Case Id
        agent_key:
          type: string
          title: Agent Key
        force_refresh_report:
          type: boolean
          title: Force Refresh Report
          default: false
        download_test_report:
          type: boolean
          title: Download Test Report
          default: false
        report_version:
          type: string
          title: Report Version
          default: v1
      type: object
      required:
      - case_id
      - agent_key
      title: ReportDownloadRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key obtained from your Parcha account settings. Include as Bearer token in the Authorization header.
    HTTPBearer:
      type: http
      scheme: bearer
x-refined-from:
- parcha-docs-openapi.yaml
- parcha-openapi-original.json

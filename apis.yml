aid: parcha
name: Parcha
description: >-
  Parcha is an AI compliance platform that automates customer due diligence, KYB (Know
  Your Business) and KYC (Know Your Customer) reviews, document verification, and risk
  screening for banks and fintechs. Its AI agents run configurable checks — sanctions
  and PEP screening (OFAC/UN/EU/HMT), adverse media, business registration, beneficial
  ownership, and verification of documents like incorporation papers, EIN certificates,
  and proof of address — across 90+ watchlists, 140+ jurisdictions, and 200+ languages.
  Parcha exposes a REST API (bearer-token auth, agent-based jobs, HMAC-signed webhooks,
  a sandbox server) so onboarding workflows can start KYB/KYC reviews or run individual
  compliance checks programmatically. Customers include Pipe, Bancoli, Flutterwave, and
  Bridge. Backed by Initialized Capital and Kindred Ventures.
